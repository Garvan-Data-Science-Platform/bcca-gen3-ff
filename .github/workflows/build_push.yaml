name: Build Image and Push to DSP Registry

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  compute_tag:
    name: Compute tag name
    runs-on: ubuntu-latest
    outputs:
      OVERRIDE_TAG_NAME: ${{ steps.set_tag.outputs.OVERRIDE_TAG_NAME }}
    steps:
      - name: Compute OVERRIDE_TAG_NAME
        id: set_tag
        shell: bash
        run: |
          CLEAN_BRANCH=$(echo "$GITHUB_REF_NAME" | tr '/' '_')
          echo "OVERRIDE_TAG_NAME=${CLEAN_BRANCH}" >> "$GITHUB_OUTPUT"

  select_build:
    name: Select build settings
    runs-on: ubuntu-latest
    outputs:
      DOCKERFILE_LOCATION: ${{ steps.pick.outputs.DOCKERFILE_LOCATION }}
    steps:
      - name: Pick Dockerfile
        id: pick
        shell: bash
        run: |
          if [ "${{ github.event.repository.fork }}" = "true" ]; then
            echo "DOCKERFILE_LOCATION=Dockerfile.production" >> "$GITHUB_OUTPUT"
          else
            echo "DOCKERFILE_LOCATION=Dockerfile.config" >> "$GITHUB_OUTPUT"
          fi

  security:
    name: Security Pipeline
    uses: uc-cdis/.github/.github/workflows/securitypipeline.yaml@master
    with:
      python-poetry: 'false'
    secrets: inherit # pragma: allowlist-secret

  build_push:
    name: Build and Push Images
    needs: [compute_tag, select_build]
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/244837148731/locations/global/workloadIdentityPools/gh-identity-pool/providers/gh-provider'
          service_account: 'gcp-github-access@dsp-registry-410602.iam.gserviceaccount.com'

      - name: Docker auth
        run: gcloud auth configure-docker australia-southeast1-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push ${{ matrix.name }} Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ needs.select_build.outputs.DOCKERFILE_LOCATION }}
          platforms: 'linux/amd64'
          push: true
          tags: |
            australia-southeast1-docker.pkg.dev/dsp-registry-410602/garvan-public/${{ github.event.repository.name }}:${{ needs.compute_tag.outputs.OVERRIDE_TAG_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
